# LaTablée Proxy — thin nginx ingress proxy to the hosted LaTablée instance.
# Config is rendered at runtime by run.sh from /data/options.json — no secrets baked in.
# Base nginx.conf ships in the HA base image; this template is replaced by run.sh.
events {}
http {
    include /etc/nginx/mime.types;
    include /etc/nginx/conf.d/*.conf;
}